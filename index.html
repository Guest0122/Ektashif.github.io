<style>html{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>اكتشف</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: one column, a sticky top bar, one big lesson card (simulation, then explanation), topic index below. */
:root{--bg:#f1f4f3;--fg:#13201f;--muted:#566766;--card:#ffffff;--line:#d3dcdb;--accent:#0b7a75;--accent-fg:#ffffff;--warm:#d4560a;--blue:#2c5dc9;--soft:#e4ecea;
--display:'Readex Pro','Segoe UI',Tahoma,sans-serif;--body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1514;--fg:#e5efed;--muted:#97aaa8;--card:#152120;--line:#283a38;--accent:#3fd0c6;--accent-fg:#06211f;--warm:#ff8d52;--blue:#7ea4ff;--soft:#1d2d2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1514;--fg:#e5efed;--muted:#97aaa8;--card:#152120;--line:#283a38;--accent:#3fd0c6;--accent-fg:#06211f;--warm:#ff8d52;--blue:#7ea4ff;--soft:#1d2d2b;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 14px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.count{font-size:14px;color:var(--muted);text-align:left;white-space:nowrap}
.count b{color:var(--accent);font-family:var(--display);font-size:22px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:10px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600;font-size:17px;padding:12px 22px;width:100%}
article{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:14px}
.cat{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);background:var(--soft);padding:2px 12px;border-radius:99px}
h1{font-family:var(--display);font-size:clamp(22px,5.5vw,30px);line-height:1.5;margin:8px 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 14px}
.sim{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.cv{display:block;width:100%}
.ctls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px;padding:8px 4px 2px}
.ctl{display:flex;flex-direction:column;font-size:14px;color:var(--muted);min-width:0}
.ctl input{width:100%;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;padding:6px 4px 0}
.row button{padding:6px 14px;font-size:14px}
.row button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.read{display:flex;flex-wrap:wrap;gap:6px 18px;padding:6px 4px 0;font-size:14px;font-variant-numeric:tabular-nums}
.read b{color:var(--warm);font-family:var(--display);font-weight:500}
h2{font-family:var(--display);font-size:18px;margin:22px 0 4px}
article p{margin:0 0 8px;max-width:65ch}
.key{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:18px}
.key h2{margin-top:0;color:var(--accent)}
.key p{margin:0}
.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
@media(min-width:560px){.actions{grid-template-columns:2fr 1fr}}
.actions .done[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
nav h2{margin-top:30px}
.grp{margin:10px 0 4px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;font-size:14px;padding:5px 12px;border-radius:99px}
.chips a.seen::before{content:"✓ ";color:var(--accent);font-weight:700}
.chips a.cur{border-color:var(--accent);background:var(--soft)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.src{font-size:14px;color:var(--muted);margin-top:16px}
.src a{color:var(--accent);font-weight:600;word-break:break-word}
</style>
<div class="wrap" dir="rtl" lang="ar">
<header><div class="brand">اكتشف<small>معلومة علمية بمحاكاة، كل يوم</small></div><div class="count">اكتشفت<br><b id="cnt">0</b> من <span id="tot"></span></div></header>
<button class="go" id="next" type="button">اكتشف شيئًا جديدًا ↻</button>
<article id="card"></article>
<nav><h2>كل الدروس</h2><div id="idx"></div></nav>
</div>
<script>
const T=[];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let uid=0;
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function cv(host,h){const c=el('canvas','cv');host.append(c);const x=c.getContext('2d');const o={c,x,h,w:0};
 o.fit=()=>{const r=c.parentElement.clientWidth-20;const d=devicePixelRatio||1;c.style.height=h+'px';c.width=r*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);o.w=r};
 o.begin=()=>{if(Math.abs(c.parentElement.clientWidth-20-o.w)>1)o.fit();x.clearRect(0,0,o.w,h);return x};o.fit();return o}
function sl(host,label,min,max,step,val,unit,fn){let g=host.querySelector('.ctls');if(!g){g=el('div','ctls');host.append(g)}
 const w=el('label','ctl');const s=el('span');const i=el('input');i.type='range';i.id='s'+(uid++);i.min=min;i.max=max;i.step=step;i.value=val;const o={v:+val};
 const u=()=>{o.v=+i.value;s.textContent=label+': '+o.v.toLocaleString('en')+(unit?' '+unit:'');fn&&fn(o.v)};i.oninput=u;w.append(s,i);g.append(w);u();return o}
function read(host){const r=el('div','read');host.append(r);return(a)=>{r.innerHTML=a.map(p=>p[0]+' <b>'+p[1]+'</b>').join('')}}
function btns(host,list,cb,start){const r=el('div','row');const bs=list.map((t,k)=>{const b=el('button',null,t);b.type='button';b.onclick=()=>{bs.forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');cb(k)};r.append(b);return b});host.append(r);bs[start||0].setAttribute('aria-pressed','true');cb(start||0)}
function run(fn){let id,l=performance.now();const f=t=>{const dt=Math.min(.05,(t-l)/1000);l=t;fn(dt);id=requestAnimationFrame(f)};id=requestAnimationFrame(f);return()=>cancelAnimationFrame(id)}
function arrow(x,x1,y1,x2,y2,c,w){x.strokeStyle=c;x.fillStyle=c;x.lineWidth=w||2;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();const a=Math.atan2(y2-y1,x2-x1);x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-9*Math.cos(a-.4),y2-9*Math.sin(a-.4));x.lineTo(x2-9*Math.cos(a+.4),y2-9*Math.sin(a+.4));x.fill()}
function txt(x,s,px,py,c,sz,al){x.fillStyle=c;x.font=(sz||13)+'px '+css('--body');x.textAlign=al||'center';x.fillText(s,px,py)}

T.push({id:'accel',cat:'فيزياء',t:'التسارع: لماذا يتحرك الجسم بسرعة أكبر؟',lead:'القانون الثاني لنيوتن: القوة هي ما يغيّر سرعة الجسم، والكتلة هي ما يقاومها.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,230);let x=0,v=0,hist=[],tm=0;
 const F=sl(s,'القوة F',1,20,1,8,'N'),M=sl(s,'الكتلة m',1,10,1,2,'kg');const rd=read(s);
 return run(dt=>{const a=F.v/M.v;v+=a*dt;x+=v*dt;tm+=dt;if(x>1){x=0;v=0;hist=[];tm=0}hist.push([tm,v]);if(hist.length>400)hist.shift();
  const g=c.begin(),W=c.w;g.strokeStyle=css('--line');g.lineWidth=2;g.beginPath();g.moveTo(10,90);g.lineTo(W-10,90);g.stroke();
  const px=20+x*(W-90),sz=26+M.v*3;g.fillStyle=css('--blue');g.fillRect(px,90-sz,sz+10,sz);
  arrow(g,px-4,90-sz/2,px-4-F.v*3.5,90-sz/2,css('--warm'),3);txt(g,'F',px-8-F.v*3.5,90-sz/2-8,css('--warm'),13);
  g.strokeStyle=css('--line');g.lineWidth=1;g.strokeRect(40,120,W-60,100);txt(g,'السرعة v',W-30,134,css('--muted'),12,'right');
  g.strokeStyle=css('--accent');g.lineWidth=2.5;g.beginPath();const vm=Math.max(1,20/1)*0.5;hist.forEach((p,i)=>{const X=40+(i/400)*(W-60),Y=220-Math.min(96,p[1]*40);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke();
  rd([['التسارع a = F ÷ m =',a.toFixed(2)+' m/s²'],['السرعة الآن',v.toFixed(2)+' m/s']])})},
info:[['ماذا نرى؟','العربة تتلقى قوة ثابتة، فتزداد سرعتها بانتظام. المنحنى في الأسفل مستقيم لأن التسارع ثابت.'],['لماذا يحدث هذا؟','حسب نيوتن a = F / m. ضاعف القوة يتضاعف التسارع، وضاعف الكتلة يصبح التسارع نصفًا. الكتلة هي «ممانعة» الجسم لتغيير حركته (الجمود).']],
key:'القوة لا تصنع السرعة بل تصنع التغيّر في السرعة. بلا قوة تبقى السرعة كما هي، وهذا هو قانون الجمود.',think:'لماذا يحتاج شاحن ثقيل إلى مسافة أطول ليتوقف من سيارة صغيرة بنفس السرعة؟'});

T.push({id:'spring',cat:'فيزياء',t:'الاهتزاز: كيف يعمل النواس المرن؟',lead:'كتلة معلّقة بنابض تتحرك ذهابًا وإيابًا. ما الذي يحدد سرعة الاهتزاز؟',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,250);let t=0,tr=[];
 const K=sl(s,'ثابت النابض k',5,100,1,30,'N/m'),M=sl(s,'الكتلة m',0.2,5,0.1,1,'kg'),A=sl(s,'السعة A',0.2,1,0.05,0.6,'');const rd=read(s);
 return run(dt=>{t+=dt;const w=Math.sqrt(K.v/M.v),T0=2*Math.PI/w,y=A.v*Math.cos(w*t);tr.push(y);if(tr.length>260)tr.shift();
  const g=c.begin(),W=c.w;const cx=70,top=14;const ym=top+70+y*55,len=ym-top;
  g.strokeStyle=css('--muted');g.lineWidth=3;g.beginPath();g.moveTo(cx-30,top);g.lineTo(cx+30,top);g.stroke();
  g.strokeStyle=css('--fg');g.lineWidth=2;g.beginPath();g.moveTo(cx,top);const n=12;for(let i=1;i<=n;i++){g.lineTo(cx+(i%2?14:-14),top+len*i/n)}g.lineTo(cx,ym);g.stroke();
  const sz=22+M.v*5;g.fillStyle=css('--blue');g.fillRect(cx-sz/2,ym,sz,sz);
  g.setLineDash([4,4]);g.strokeStyle=css('--line');g.beginPath();g.moveTo(120,top+70+30);g.lineTo(W-10,top+70+30);g.stroke();g.setLineDash([]);
  g.strokeStyle=css('--warm');g.lineWidth=2.5;g.beginPath();tr.forEach((q,i)=>{const X=W-10-(tr.length-i)*((W-130)/260),Y=top+100+q*55;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke();
  txt(g,'الموضع عبر الزمن',W-12,18,css('--muted'),12,'right');
  rd([['الدور T = 2π√(m/k) =',T0.toFixed(2)+' s'],['التواتر f =',(1/T0).toFixed(2)+' Hz']])})},
info:[['ماذا نرى؟','الكتلة تتأرجح حول موضع التوازن، وخط الموضع يرسم موجة جيبية. غيّر k وm وانظر كيف يتغير الدور، ثم غيّر السعة: الدور لا يتغير.'],['لماذا يحدث هذا؟','النابض يشدّ الكتلة نحو التوازن بقوة تتناسب مع الإزاحة (قانون هوك F = −kx). عند التوازن تكون السرعة أكبر ما يمكن، فتتجاوزه الكتلة بفضل الجمود، ثم يعيدها النابض. نابض أقسى أو كتلة أخف يعني اهتزازًا أسرع.']],
key:'كل نظام فيه قوة إرجاع تتناسب مع الإزاحة يهتز اهتزازًا توافقيًا، والدور يتعلق بالنظام (k وm) لا بقوة الدفع الأولى.',think:'لماذا يبقى دور النواس تقريبًا ثابتًا حتى لو تضاءلت سعته مع الاحتكاك؟'});

T.push({id:'ohm',cat:'فيزياء',t:'الدارة الكهربائية: ماذا يجري داخل السلك؟',lead:'البطارية تدفع الشحنات، والمقاومة تحدّ من تدفقها. قانون أوم يربط بينهما.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,230);let ph=0;
 const V=sl(s,'التوتر V',1,12,1,6,'V'),R=sl(s,'المقاومة R',1,20,1,6,'Ω');const rd=read(s);
 return run(dt=>{const I=V.v/R.v;ph+=dt*I*40;const g=c.begin(),W=c.w,L=40,Rr=W-40,Tp=40,B=190;
  g.strokeStyle=css('--muted');g.lineWidth=3;g.strokeRect(L,Tp,Rr-L,B-Tp);
  g.fillStyle=css('--card');g.fillRect(L-14,100,28,50);g.strokeStyle=css('--fg');g.lineWidth=3;g.beginPath();g.moveTo(L-14,112);g.lineTo(L+14,112);g.moveTo(L-8,132);g.lineTo(L+8,132);g.stroke();txt(g,'+',L+26,114,css('--warm'),16);txt(g,'البطارية',L,170,css('--muted'),12);
  g.fillStyle=css('--card');g.fillRect(W/2-34,Tp-12,68,24);g.strokeStyle=css('--warm');g.lineWidth=3;g.strokeRect(W/2-34,Tp-12,68,24);txt(g,'R',W/2,Tp-22,css('--warm'),13);
  const P=2*(Rr-L+B-Tp),N=36;g.fillStyle=css('--accent');for(let i=0;i<N;i++){let d=((i/N)*P+ph)%P,X,Y;const w=Rr-L,hh=B-Tp;
   if(d<w){X=L+d;Y=Tp}else if(d<w+hh){X=Rr;Y=Tp+d-w}else if(d<2*w+hh){X=Rr-(d-w-hh);Y=B}else{X=L;Y=B-(d-2*w-hh)}
   g.beginPath();g.arc(X,Y,3.5,0,7);g.fill()}
  rd([['الشدة I = V ÷ R =',I.toFixed(2)+' A'],['الاستطاعة P = V·I =',(V.v*I).toFixed(1)+' W']])})},
info:[['ماذا نرى؟','النقاط هي حاملات الشحنة، وسرعتها ترمز لشدة التيار. زِد التوتر فتزداد سرعتها، وزِد المقاومة فتبطؤ.'],['لماذا يحدث هذا؟','البطارية تخلق فرق كمون (توتر) يدفع الشحنات. المقاومة تصادمات تحوّل جزءًا من الطاقة إلى حرارة. قانون أوم: I = V / R. الاستطاعة المبددة حرارة هي P = V·I = R·I².']],
key:'التوتر هو «الدافع»، والمقاومة هي «العائق»، والشدة هي النتيجة. وهذا ما يفسّر سخونة الأسلاك الرفيعة.',think:'لماذا تستعمل خطوط نقل الكهرباء توترًا عاليًا جدًا؟ (فكّر في P = R·I²)'});

T.push({id:'membrane',cat:'بيولوجيا',t:'غشاء الخلية: لماذا هو «سائل»؟',lead:'الشحوم الفوسفورية تتحرك باستمرار. الحرارة والكوليسترول يتحكمان في هذه الحركة.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,230);const N=16;const a=[],b=[];for(let i=0;i<N;i++){a.push({o:0,vx:0,dy:0});b.push({o:0,vx:0,dy:0})}let chol=0;
 const Tm=sl(s,'درجة الحرارة',0,60,1,37,'°C');btns(s,['بدون كوليسترول','مع كوليسترول'],k=>chol=k,0);const rd=read(s);
 return run(dt=>{const amp=(0.15+Tm.v/60*1.6)*(chol?.5:1);const g=c.begin(),W=c.w,sp=(W-20)/N;
  [a,b].forEach((L,ly)=>L.forEach((p,i)=>{p.vx+=(Math.random()-.5)*amp*2;p.vx*=.9;p.o+=p.vx-p.o*.05;p.o=Math.max(-sp*.45,Math.min(sp*.45,p.o));p.dy+=(Math.random()-.5)*amp*.6;p.dy*=.85;
   const X=10+sp*(i+.5)+p.o,top=ly==0,Y=top?70:160+0,d=top?1:-1,Y0=top?Y+p.dy:Y-p.dy;
   g.strokeStyle=css('--warm');g.lineWidth=2;[-3,3].forEach(q=>{g.beginPath();g.moveTo(X+q,Y0+d*8);g.quickCurveTo&&0;g.lineTo(X+q+(Math.random()-.5)*amp*2,Y0+d*(top?44:44));g.stroke()});
   g.fillStyle=css('--blue');g.beginPath();g.arc(X,Y0,7,0,7);g.fill()}));
  if(chol){g.fillStyle=css('--accent');for(let i=0;i<N;i+=2){g.fillRect(10+sp*(i+1)-2,92,4,36)}}
  txt(g,'خارج الخلية',W-8,22,css('--muted'),12,'right');txt(g,'داخل الخلية',W-8,222,css('--muted'),12,'right');
  rd([['الميوعة',(amp>1.2?'عالية جدًا':amp>.6?'مناسبة':'منخفضة (متصلّبة)')]])})},
info:[['ماذا نرى؟','الكرات الزرقاء رؤوس محبة للماء، والذيول البرتقالية أحماض دهنية تبتعد عن الماء، فتتشكل طبقتان متقابلتان. تتجاور الجزيئات وتتحرك جانبيًا. أضف الكوليسترول (القضبان الفيروزية) فتقل الحركة.'],['لماذا يحدث هذا؟','في الحرارة العالية تزداد الطاقة الحركية فيصير الغشاء مائعًا جدًا، وفي البرودة يتصلّب. الكوليسترول يعمل كمنظّم: يخفف الميوعة في الحرارة ويمنع التصلب في البرد. أما صلابة النبات فمصدرها جدار خلوي من السيللوز وضغط الامتلاء داخل الخلية، وليس الغشاء نفسه، فغشاء الخلية النباتية سائل أيضًا.']],
key:'الغشاء ليس جدارًا ثابتًا بل بحر «فسيفساء سائلة». الحركة هي ما يسمح للبروتينات بالعمل والانتقال.',think:'لماذا تكثر الأحماض الدهنية غير المشبعة في أغشية الكائنات التي تعيش في الماء البارد؟'});

T.push({id:'heart',cat:'بيولوجيا',t:'القلب: كيف يضخ الدم في دورتين؟',lead:'أربع حجرات ومضختان: اليمنى نحو الرئتين، واليسرى نحو الجسم كله.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,270);let ph=0;const B=sl(s,'نبضات القلب',40,180,5,70,'/min');const rd=read(s);
 const gs=(t,a,b)=>t>=a&&t<b?Math.sin((t-a)/(b-a)*Math.PI):0;
 return run(dt=>{ph=(ph+dt*B.v/60)%1;const at=gs(ph,.0,.15),vt=gs(ph,.18,.5);const g=c.begin(),W=c.w,m=W/2;
  const ch=(x,y,w,hh,k,col,nm)=>{const s2=1-k*.14;g.fillStyle=col;g.globalAlpha=.85;g.beginPath();g.roundRect(x+w*(1-s2)/2,y+hh*(1-s2)/2,w*s2,hh*s2,14);g.fill();g.globalAlpha=1;txt(g,nm,x+w/2,y+hh/2+5,'#fff',13)};
  const bl=css('--blue'),rd2=css('--warm'),cw=Math.min(120,W/2-30);
  ch(m+8,16,cw,56,at,rd2,'أذين أيسر');ch(m-cw-8,16,cw,56,at,bl,'أذين أيمن');ch(m+8,80,cw,90,vt,rd2,'بطين أيسر');ch(m-cw-8,80,cw,90,vt,bl,'بطين أيمن');
  txt(g,'إلى الرئتين ←',m-cw-8-4,186,bl,12,'right');txt(g,'→ إلى الجسم',m+cw+8+4,186,rd2,12,'left');
  g.strokeStyle=css('--line');g.lineWidth=1;g.strokeRect(10,205,W-20,56);g.strokeStyle=css('--accent');g.lineWidth=2;g.beginPath();
  for(let i=0;i<=W-24;i++){const p=((ph-(i/(W-24))*Math.min(3,B.v/60*2)+10)%1);let y=0;y+=.25*Math.exp(-Math.pow((p-.08)/.025,2));y-=.15*Math.exp(-Math.pow((p-.17)/.008,2));y+=1*Math.exp(-Math.pow((p-.19)/.008,2));y-=.25*Math.exp(-Math.pow((p-.21)/.008,2));y+=.35*Math.exp(-Math.pow((p-.4)/.05,2));const Y=250-y*34;i?g.lineTo(12+i,Y):g.moveTo(12+i,Y)}g.stroke();
  rd([['المرحلة',ph<.17?'انقباض الأذينين':ph<.5?'انقباض البطينين':'انبساط (امتلاء)'],['الدورة =',(60/B.v).toFixed(2)+' s']])})},
info:[['ماذا نرى؟','الأذينان ينقبضان أولًا فيملآن البطينين، ثم ينقبض البطينان بقوة، ثم يرتاح القلب. الأزرق دم قليل الأكسجين، والبرتقالي دم مؤكسج. الأسفل تخطيط كهربائي مبسّط (ECG).'],['لماذا يحدث هذا؟','عقدة جيبية أذينية (منظّم النبض) تولّد إشارة كهربائية تنتشر في الأذينين ثم تتأخر قليلًا في العقدة الأذينية البطينية، فتتيح للبطينين الامتلاء قبل الانقباض. صمّامات القلب تفرض اتجاهًا واحدًا للدم.']],
key:'القلب مضختان في صف واحد: الدورة الصغرى (قلب ← رئتان ← قلب) والكبرى (قلب ← جسم ← قلب). الكهرباء تسبق الانقباض.',think:'لماذا جدار البطين الأيسر أسمك من جدار البطين الأيمن؟'});

T.push({id:'erato',cat:'تاريخ العلوم',t:'كيف قيس محيط الأرض قبل ألفين سنة؟',lead:'إراتوستينس قاس ظلًا في الإسكندرية وحسب حجم كوكب كامل بالهندسة.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,260);
 const A=sl(s,'زاوية الظل في الإسكندرية',3,12,0.1,7.2,'°'),D=sl(s,'المسافة بين المدينتين',3000,8000,100,5000,'استاد');const rd=read(s);
 return run(dt=>{const g=c.begin(),W=c.w,cx=W/2,cy=150,R=95;g.strokeStyle=css('--blue');g.lineWidth=2.5;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();
  const a=A.v*Math.PI/180,top=-Math.PI/2;const P=(t)=>[cx+R*Math.cos(t),cy+R*Math.sin(t)];const p1=P(top),p2=P(top-a);
  g.strokeStyle=css('--warm');g.lineWidth=1.5;for(let k=-1;k<=1;k++){g.beginPath();g.moveTo(cx-170+k*0,cy-R-70+k*34);g.lineTo(cx,cy-R+k*0);}
  [[p1,'أسوان (سيين)'],[p2,'الإسكندرية']].forEach(([p,n],i)=>{g.strokeStyle=css('--warm');g.lineWidth=2;g.beginPath();g.moveTo(p[0],p[1]-60);g.lineTo(p[0],p[1]);g.stroke();g.fillStyle=css('--fg');g.beginPath();g.arc(p[0],p[1],5,0,7);g.fill();txt(g,n,p[0],p[1]-68,css('--muted'),12)});
  g.setLineDash([4,4]);g.strokeStyle=css('--muted');g.lineWidth=1;[p1,p2].forEach(p=>{g.beginPath();g.moveTo(cx,cy);g.lineTo(p[0],p[1]);g.stroke()});g.setLineDash([]);
  g.strokeStyle=css('--accent');g.lineWidth=2;g.beginPath();g.arc(cx,cy,28,top-a,top);g.stroke();txt(g,A.v.toFixed(1)+'°',cx-10,cy-38,css('--accent'),13);
  const C=360/A.v*D.v,km=C*0.1575,Rk=km/2/Math.PI,M=9.81*Math.pow(Rk*1000,2)/6.674e-11;
  rd([['المحيط =',Math.round(C).toLocaleString('en')+' استاد'],['≈',Math.round(km).toLocaleString('en')+' km'],['نصف القطر ≈',Math.round(Rk).toLocaleString('en')+' km'],['كتلة الأرض M = gR²/G ≈',(M/1e24).toFixed(2)+'×10²⁴ kg']])})},
info:[['ماذا نرى؟','الشمس بعيدة جدًا فأشعتها متوازية. في سيين (أسوان) كانت عمودية تمامًا، وفي الإسكندرية صنعت زاوية نحو 7.2°، وهي 1/50 من دائرة كاملة.'],['لماذا يحدث هذا؟','إذا قطعت المسافة بين المدينتين زاوية 7.2° من مركز الأرض، فالمحيط = 360 ÷ 7.2 × المسافة = 50 × 5000 استاد = 250000 استاد، أي نحو 40000 km (تقديرات طول الاستاد تختلف، لذلك الدقة غير مؤكدة). ومن نصف القطر استنتج العلماء لاحقًا الكتلة: بعد أن قاس كافنديش ثابت الجذب G سنة 1798 بميزان الالتواء، صار M = gR²/G ≈ 6×10²⁴ kg.']],
key:'الفكرة العلمية الكبرى: قياس بسيط (زاوية ظل) + نموذج هندسي صحيح = معرفة بأشياء لا نستطيع الوصول إليها مباشرة.',think:'ما الافتراضان اللذان بنى عليهما إراتوستينس حسابه؟ (شكل الأرض وتوازي أشعة الشمس)'});

T.push({id:'trig',cat:'رياضيات',t:'الدائرة المثلثية: من أين تأتي الجيب والتجيب؟',lead:'sin وcos ليستا حيلة حسابية: هما إحداثيا نقطة تدور على دائرة.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,250);let th=0,play=true;
 const S=sl(s,'الزاوية θ',0,360,1,40,'°',v=>{if(!play)th=v*Math.PI/180});btns(s,['دوران تلقائي','يدوي'],k=>play=!k,0);const rd=read(s);
 return run(dt=>{if(play){th=(th+dt*.8)%(2*Math.PI)}const g=c.begin(),W=c.w,cx=100,cy=125,R=80;
  g.strokeStyle=css('--line');g.lineWidth=1;g.beginPath();g.moveTo(10,cy);g.lineTo(W-6,cy);g.moveTo(cx,25);g.lineTo(cx,225);g.stroke();
  g.strokeStyle=css('--muted');g.lineWidth=2;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();
  const px=cx+R*Math.cos(th),py=cy-R*Math.sin(th);
  g.strokeStyle=css('--blue');g.lineWidth=3;g.beginPath();g.moveTo(cx,cy);g.lineTo(px,cy);g.stroke();
  g.strokeStyle=css('--warm');g.beginPath();g.moveTo(px,cy);g.lineTo(px,py);g.stroke();
  g.strokeStyle=css('--fg');g.lineWidth=1.5;g.beginPath();g.moveTo(cx,cy);g.lineTo(px,py);g.stroke();g.fillStyle=css('--fg');g.beginPath();g.arc(px,py,5,0,7);g.fill();
  const x0=215,wl=W-x0-10;g.strokeStyle=css('--warm');g.lineWidth=2.5;g.beginPath();for(let i=0;i<=wl;i++){const a=th-i/wl*2*Math.PI;const Y=cy-R*Math.sin(a);i?g.lineTo(x0+i,Y):g.moveTo(x0+i,Y)}g.stroke();
  g.setLineDash([3,4]);g.strokeStyle=css('--warm');g.lineWidth=1;g.beginPath();g.moveTo(px,py);g.lineTo(x0,py);g.stroke();g.setLineDash([]);
  txt(g,'cos θ',(cx+px)/2,cy+16,css('--blue'),13);txt(g,'sin θ',px+(Math.cos(th)>=0?24:-24),(cy+py)/2,css('--warm'),13);
  rd([['θ =',(th*180/Math.PI).toFixed(0)+'°'],['cos θ =',Math.cos(th).toFixed(2)],['sin θ =',Math.sin(th).toFixed(2)]])})},
info:[['ماذا نرى؟','النقطة تدور على دائرة نصف قطرها 1. المسافة الأفقية للنقطة هي cos θ، والمسافة العمودية هي sin θ. وعندما نرسم الارتفاع عبر الزمن تظهر الموجة الجيبية.'],['لماذا يحدث هذا؟','لأن المثلث القائم داخل الدائرة وتره 1، فتكون النسب sin = المقابل/الوتر وcos = المجاور/الوتر. ولهذا السبب بالذات تظهر الموجة الجيبية في كل حركة دورانية أو اهتزازية: النواس والتيار المتناوب والصوت.'],],
key:'الجيب هو «ظل» الحركة الدائرية على محور. فهم الدائرة يعني فهم الاهتزاز نفسه (راجع درس النواس).',think:'لماذا sin²θ + cos²θ = 1 دائمًا؟ (فكّر في فيثاغورس داخل الدائرة)'});

T.push({id:'gas',cat:'كيمياء',t:'الغاز المثالي: من أين يأتي الضغط؟',lead:'الضغط ليس شيئًا غامضًا: هو عدد وقوة اصطدام الجزيئات بالجدران.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,230);const n=40,p=[];for(let i=0;i<n;i++)p.push({x:Math.random(),y:Math.random(),a:Math.random()*6.28});let hits=0,acc=0,shown=0,flash=0;
 const Tk=sl(s,'درجة الحرارة',100,600,10,300,'K'),V=sl(s,'الحجم',0.3,1,0.05,1,'(نسبة)');const rd=read(s);
 return run(dt=>{const g=c.begin(),W=c.w,bw=(W-40)*V.v,bh=190,x0=20,y0=20,sp=Math.sqrt(Tk.v)/17*1.3;
  p.forEach(q=>{q.x+=Math.cos(q.a)*sp*dt/(bw/400);q.y+=Math.sin(q.a)*sp*dt/(bh/400);
   if(q.x<0){q.x=0;q.a=Math.PI-q.a;hits++}if(q.x>1){q.x=1;q.a=Math.PI-q.a;hits++;flash=1}if(q.y<0||q.y>1){q.y=q.y<0?0:1;q.a=-q.a}});
  acc+=dt;if(acc>1){shown=hits;hits=0;acc=0}flash=Math.max(0,flash-dt*4);
  g.strokeStyle=css('--muted');g.lineWidth=3;g.strokeRect(x0,y0,bw,bh);g.fillStyle=css('--warm');g.globalAlpha=.4+flash*.5;g.fillRect(x0+bw,y0,5,bh);g.globalAlpha=1;
  g.fillStyle=css('--blue');p.forEach(q=>{g.beginPath();g.arc(x0+q.x*bw,y0+q.y*bh,3.5,0,7);g.fill()});
  rd([['P ∝ T ÷ V =',(Tk.v/300/V.v).toFixed(2)+' (نسبة)'],['اصطدامات بالجدار الأيمن/ثانية',String(shown)]])})},
info:[['ماذا نرى؟','جزيئات تتحرك عشوائيًا وترتد عن الجدران. اللوح البرتقالي على اليمين مكبس متحرك. اخفض الحجم فتزيد الاصطدامات بالجدار، وارفع الحرارة فتتسارع الجزيئات.'],['لماذا يحدث هذا؟','حرارة أعلى تعني سرعة جزيئات أكبر، فتزداد قوة كل اصطدام وعددها. وحجم أصغر يعني مسافة أقصر بين الجدران فيزداد عدد الاصطدامات. نتيجة ذلك قانون الغاز المثالي PV = nRT.']],
key:'الحرارة هي مقياس للطاقة الحركية المتوسطة للجزيئات، والضغط هو الأثر الميكانيكي لتلك الحركة على الجدران.',think:'لماذا ينفجر بالون مغلق إذا تُرك في الشمس؟'});

T.push({id:'fuel',cat:'كيمياء',t:'وقود الطائرات: لماذا الكيروزين؟',lead:'ما يهم في الطائرة هو الطاقة في كل كيلوغرام وفي كل لتر معًا.',
setup(h){const s=el('div','sim');h.append(s);const c=cv(s,250);const F=[['كيروزين',43,34.5,.8,'--accent'],['بنزين',44,32,.74,'--blue'],['هيدروجين سائل',120,8.5,.071,'--warm'],['بطارية Li-ion',.9,2.3,2.5,'--muted']];let mode=0;
 const Lt=sl(s,'حجم الخزان',100,1000,50,500,'L');btns(s,['الطاقة في الخزان كاملًا (MJ)','الطاقة لكل كغ (MJ/kg)'],k=>mode=k,0);const rd=read(s);
 return run(dt=>{const g=c.begin(),W=c.w;const vals=F.map(f=>mode?f[1]:f[2]*Lt.v);const mx=Math.max(...vals);const bw=Math.min(90,(W-60)/4-14);
  F.forEach((f,i)=>{const hh=Math.max(3,vals[i]/mx*150),X=30+i*((W-60)/4)+((W-60)/4-bw)/2;g.fillStyle=css(f[4]);g.fillRect(X,200-hh,bw,hh);
   txt(g,f[0],X+bw/2,222,css('--fg'),12);txt(g,vals[i].toLocaleString('en',{maximumFractionDigits:1}),X+bw/2,194-hh,css('--fg'),12);
   if(!mode)txt(g,'كتلة '+Math.round(Lt.v*f[3]).toLocaleString('en')+' kg',X+bw/2,240,css('--muted'),11)});
  rd([['كيروزين (Jet A): تجمّد',' −47°C'],['نقطة الوميض','≥ 38°C']])})},
info:[['ماذا نرى؟','في الوضع الأول: الطاقة التي يخزنها نفس الخزان بكل وقود، مع كتلة الوقود الموافقة. في الثاني: الطاقة لكل كغ. الهيدروجين الأفضل بالكتلة، لكنه الأسوأ بالحجم.'],['لماذا الكيروزين؟','لأنه توازن عملي: طاقة عالية بالحجم وبالكتلة، سائل عند حرارة الجو العالي (تجمّده منخفض)، وأقل تطايرًا من البنزين فأكثر أمانًا في الأجنحة (نقطة وميض أعلى)، وهو رخيص ومتوفر وسهل التخزين. البطاريات ضعيفة جدًا في الطاقة لكل كغ، لذلك يصعب تشغيل الطائرات الكبيرة بها.']],
key:'اختيار الوقود هندسة موازنة: طاقة لكل كتلة، وطاقة لكل حجم، وأمان، وبرودة الارتفاع، والتكلفة. القيم هنا تقريبية.',think:'ما المشكلة التي تواجه الطائرة الهيدروجينية رغم تفوقها في الطاقة لكل كغ؟'});

T.push(...[{"id": "w1", "cat": "فيزياء", "kind": "تجربة", "t": "لماذا فشلت أشهر تجربة في البحث عن الأثير؟", "lead": "أرادت هذه التجربة قياس رياح غير مرئية تهب على الأرض، فلم تجد منها شيئًا، وكان هذا الفشل نقطة تحول في الفيزياء.", "steps": ["في القرن التاسع عشر افترض بعض العلماء وجود وسط يسمى الأثير الناقل للضوء (luminiferous aether). وإذا تحركت الأرض خلاله فسيكون هناك ما يشبه رياح الأثير (aether wind). أراد الأمريكيان ألبرت ميكلسون وإدوارد مورلي قياس حركة الأرض بالنسبة إلى هذا الوسط.", "أجرى الباحثان التجربة بين أبريل ويوليو 1887 في قبو سكن جامعي بجامعة وسترن ريزرف في كليفلاند بولاية أوهايو، وهي اليوم جامعة كيس وسترن ريزرف. استعملا مقياس تداخل (Michelson interferometer) يقسم الضوء إلى شعاعين متعامدين ثم يجمعهما ليكوّنا أهداب تداخل. وزاد طول الذراعين إلى نحو 11 مترًا بالانعكاسات المتكررة.", "وُضع الجهاز على كتلة حجرية ضخمة تطفو في حوض من الزئبق لتقليل الاهتزازات، ثم أُدير ببطء لمراقبة أي تغير في الأهداب. كان المتوقع إزاحة نحو 0.4 هدب، لكن أكبر إزاحة مرصودة كانت 0.02 وما زاد المتوسط كثيرًا عن 0.01. استنتجا أن سرعة الأثير أقل من سدس سرعة دوران الأرض حول الشمس (نحو 30 كم/ث)، أي قريبة من الصفر ضمن خطأ القياس.", "كانت النتيجة سلبية، وعُدّت أول دليل قوي ضد بعض نظريات الأثير، وساعدت في الطريق إلى النسبية الخاصة (special relativity). اقترح فيتزجيرالد (1889) ولورنتز (1892) انكماش الأطوال تفسيرًا لها، ثم اشتق أينشتاين عام 1905 التحويلات من مبدأ النسبية وثبات سرعة الضوء. وتكررت التجربة بدقة أكبر عبر العقود وبقيت النتيجة سلبية."], "key": "أظهرت تجربة ميكلسون ومورلي عام 1887 أن رياح الأثير لا تُرصد، وفتحت الطريق أمام النسبية الخاصة.", "src": "https://en.wikipedia.org/wiki/Michelson%E2%80%93Morley_experiment", "srct": "Michelson–Morley experiment"}, {"id": "w2", "cat": "فيزياء", "kind": "أساسية", "t": "كيف يولّد تغيّر المجال المغناطيسي تيارًا كهربائيًا؟", "lead": "من قطعة مغناطيس تتحرك داخل ملف نحصل على كهرباء، وهذه هي فكرة المولدات.", "steps": ["ينص قانون فاراداي (Faraday&#x27;s law of induction) على كيفية تأثير المجال المغناطيسي في دارة كهربائية لإنتاج قوة محركة كهربائية (electromotive force, emf). وتسمى هذه الظاهرة الحث الكهرومغناطيسي (electromagnetic induction).", "القوة المحركة حول مسار مغلق تساوي سالب معدل تغير التدفق المغناطيسي (magnetic flux) الذي يخترق ذلك المسار. والتدفق هو تكامل المجال المغناطيسي على سطح تحده الحلقة. وهو يتناسب مع عدد خطوط المجال التي تعبر الحلقة. وفي ملف من N لفة متماثلة يزداد المجموع بحسب N.", "اكتشف مايكل فاراداي الحث عام 1831، وسجل ذلك في دفتره بتاريخ 29 أغسطس. لاحظ تيارًا عابرًا في تجربة الحلقة الحديدية عند وصل دارة البطارية أو فصلها، ثم وجد أن تحريك مغناطيس داخل ملف وخارجه يولّد تيارًا أيضًا. وفي خلال شهرين صنع قرصه النحاسي الذي يعد أول مولد كهربائي. وفي 1832 اكتشف جوزيف هنري الحث بشكل مستقل لكن فاراداي نشر أولًا.", "حدد إميل لنز عام 1834 اتجاه القوة المحركة والتيار المحتثّين، وعُرف ذلك بقانون لنز (Lenz&#x27;s law). ووضع فرانتز نيومان الصيغة الرياضية عام 1845، واعتمد جيمس كلارك ماكسويل على أفكار فاراداي في نظريته بين 1861 و1862. وتعتمد المحولات والمحركات والمولدات على هذه الظاهرة."], "key": "القوة المحركة المحتثّة تساوي سالب المعدل الزمني لتغير التدفق المغناطيسي عبر الدارة.", "src": "https://en.wikipedia.org/wiki/Faraday's_law_of_induction", "srct": "Faraday&#x27;s law of induction"}, {"id": "w3", "cat": "فيزياء", "kind": "أساسية", "t": "لماذا لا يحرر الضوء الضعيف الإلكترونات مهما اشتدّ؟", "lead": "ضوء أزرق خافت يستطيع تحرير إلكترونات من فلز، بينما ضوء أحمر ساطع جدًا قد لا يفعل ذلك.", "steps": ["الظاهرة الكهروضوئية (photoelectric effect) هي انبعاث إلكترونات تسمى إلكترونات ضوئية (photoelectrons) من مادة عندما يسقط عليها إشعاع كهرومغناطيسي مثل الأشعة فوق البنفسجية. وهي أساس أجهزة كثيرة تكشف الضوء.", "لكل مادة تردد عتبة (threshold frequency)، وتحته لا تنبعث إلكترونات. أما فوقه فتزداد الطاقة الحركية العظمى للإلكترونات خطيًا مع التردد. وزيادة شدة الضوء عند تردد ثابت تزيد عدد الإلكترونات المنبعثة أي التيار، لكنها لا تغير طاقتها الحركية. فالضوء منخفض التردد لا يحرر إلكترونات حتى لو كان شديدًا، لأن طاقة كل فوتون غير كافية.", "في 1905 اقترح ألبرت أينشتاين أن الضوء يتألف من حزم طاقة منفصلة تسمى الكمّات (quanta). وفي تفسيره تمتص إلكترون واحد طاقة فوتون واحد كاملة، وتساوي طاقته الحركية العظمى طاقة الفوتون ناقص دالة الشغل (work function)، وهي أقل طاقة لنزع إلكترون من سطح المادة.", "سبقت ذلك ملاحظات هرتس عام 1887، ثم دراسات هالفاكس ولينارد. وفي 1902 وجد لينارد أن طاقة الإلكترونات لا تعتمد على شدة الضوء. ودعمت قياسات ميليكان لثابت بلانك عام 1914 نموذج أينشتاين. ونال أينشتاين جائزة نوبل في الفيزياء عام 1921. ومن التطبيقات المضاعفات الضوئية (photomultiplier tubes) ومضخمات الصورة."], "key": "تحرير الإلكترونات يعتمد على تردد الضوء، أما الشدة فتحدد عددها فقط.", "src": "https://en.wikipedia.org/wiki/Photoelectric_effect", "srct": "Photoelectric effect"}, {"id": "w4", "cat": "فيزياء", "kind": "تجربة", "t": "كيف اكتُشفت نواة الذرة من رشقات جسيمات ألفا؟", "lead": "ارتدّت بعض الجسيمات إلى الخلف عن رقاقة ذهب رقيقة جدًا، وهو أمر لم يتوقعه أحد.", "steps": ["أُجريت تجارب غايغر ومارسدن (Geiger–Marsden experiments) بين 1906 و1913 في مختبرات جامعة مانشستر، بإشراف إرنست رذرفورد، وقام بها هانز غايغر وإرنست مارسدن. وكان رذرفورد قد اكتشف جسيمات ألفا (alpha particles) عام 1899.", "وُجّهت حزمة من جسيمات ألفا من مصدر مشع نحو رقاقة فلزية رقيقة، وفضّل الباحثون الذهب لأنه يُطرق إلى رقائق رقيقة جدًا. وكان كل جسيم يُحدث وميضًا صغيرًا على شاشة من كبريتيد الزنك، فيعدّ غايغر الومضات بالمجهر في مختبر مظلم.", "مرّ معظم الجسيمات مباشرة عبر الرقاقة. لكن غايغر ومارسدن وجدا عام 1909 أن جزءًا صغيرًا ينحرف بزاوية أكبر من 90 درجة، وبعضه يرتد إلى الخلف، وقدّرا ذلك بنحو جسيم واحد من كل 8000. وكانت الفلزات الثقيلة كالذهب تعكس أكثر من الخفيفة كالألومنيوم.", "كان نموذج تومسون (plum pudding) يتصور الذرة كرة موجبة منتشرة تتخللها الإلكترونات، ولا يتوقع انحرافات كبيرة. وفي ورقته عام 1911 بيّن رذرفورد أن شحنة مركزية صغيرة وقوية تفسر النتائج. فالنواة (nucleus) أصغر بكثير من الذرة لكنها تحمل معظم كتلتها. وأكدت تجارب 1913 تنبؤاته، وكانت أساسًا لنموذج رذرفورد ثم أعمال بور."], "key": "الانحراف الكبير لجسيمات ألفا عن رقاقة الذهب دلّ على نواة صغيرة موجبة تحمل معظم كتلة الذرة.", "src": "https://en.wikipedia.org/wiki/Rutherford_scattering_experiments", "srct": "Rutherford scattering experiments"}, {"id": "w5", "cat": "فيزياء", "kind": "تاريخ", "t": "كيف تشكّلت فكرة حفظ الطاقة عبر التاريخ؟", "lead": "استغرقت الفكرة قرونًا وشارك فيها فلاسفة وفيزيائيون كثيرون قبل أن تصبح قانونًا.", "steps": ["ينص مبدأ انحفاظ الطاقة (conservation of energy) على أن الطاقة الكلية لجملة معزولة تبقى ثابتة، فهي تتحول أو تنتقل من شكل إلى آخر ولا تُخلق ولا تفنى. وجاءت بدايات الفكرة عند فلاسفة قدماء مثل طاليس وأمبيدوقليس وأبيقور في صورة فكرة جوهر محفوظ.", "في العصر الحديث المبكر افترض سيمون ستيفن عام 1605 استحالة الحركة الدائمة (perpetual motion). ووصف غاليليو عام 1639 تحول الطاقة الكامنة إلى حركية وبالعكس. وصاغ لايبنتز بين 1676 و1689 مفهوم القوة الحية (vis viva) الذي سبق الطاقة الحركية، بينما فضّل نيوتن وآخرون كمية الحركة. واقترحت إميلي دو شاتليه (1706–1749) انحفاظ الطاقة الكلية بوصفه مفهومًا مستقلًا عن كمية الحركة.", "في القرن التاسع عشر ربط الكونت رمفورد عام 1798 بين حرارة الاحتكاك في ثقب المدافع والحركة الميكانيكية. واستعمل توماس يونغ كلمة الطاقة بمعناها الحديث عام 1807. وذكر يوليوس ماير عامي 1842 و1845 تكافؤ الحرارة والشغل، وقاس جول عام 1843 المكافئ الميكانيكي للحرارة بجهازه ذي المجداف.", "نشر هيلمهولتز عام 1847 بحثه عن حفظ القوة، فنال المبدأ قبولًا عامًا. واستعمل رانكين عام 1850 عبارة قانون حفظ الطاقة لأول مرة. وفي القرن العشرين بيّن أينشتاين عام 1905 أن الكتلة تقابل طاقة، فالمحفوظ هو الكتلة والطاقة معًا. وأظهرت إيمي نويتر (1915، نُشر 1918) أن حفظ الطاقة ينتج من تناظر الانسحاب في الزمن."], "key": "قانون حفظ الطاقة ثمرة جهد تراكمي من غاليليو ولايبنتز إلى جول وهيلمهولتز ونويتر.", "src": "https://en.wikipedia.org/wiki/Conservation_of_energy", "srct": "Conservation of energy"}, {"id": "w6", "cat": "رياضيات", "kind": "أساسية", "t": "كيف نعرف أن الأعداد الأولية لا تنتهي أبدًا؟", "lead": "أثبت إقليدس في كتابه الأصول أن قائمة الأعداد الأولية لا يمكن أن تكتمل، ويوجد اليوم ما لا يقل عن 200 برهان لهذه الحقيقة.", "steps": ["تنص مبرهنة إقليدس (Euclid&#x27;s theorem) على أن عدد الأعداد الأولية (prime numbers) غير منتهٍ. وقد وردت في كتاب الأصول (Elements)، الكتاب التاسع، القضية 20، وصاغها إقليدس بقوله إن الأعداد الأولية أكثر من أي عدد مقترح من الأعداد الأولية.", "فكرة البرهان: نأخذ أي قائمة منتهية من الأعداد الأولية p₁ وp₂ حتى pₙ، ونضرب عناصرها معًا فنحصل على P، ثم نكوّن العدد q = P + 1.", "هناك حالتان. إن كان q أوليًّا فهو عدد أولي جديد ليس في القائمة. وإن لم يكن أوليًّا فله قاسم أولي p. فلو كان p ضمن القائمة لقسم P أيضًا، وبالتالي يقسم الفرق (P + 1) − P = 1، ولا يوجد عدد أولي يقسم 1. إذن p خارج القائمة.", "بما أن هذا ينطبق على كل قائمة منتهية، فلا توجد قائمة منتهية تضم كل الأعداد الأولية. وفي ما بعد قدّم أويلر (Euler) برهانًا مختلفًا يعتمد على التحليل الوحيد إلى عوامل أولية، وقدّم فورستنبرغ (Furstenberg) سنة 1955 برهانًا يستخدم التبولوجيا."], "key": "مهما كانت قائمة الأعداد الأولية التي بين يديك، نستطيع دائمًا إيجاد عدد أولي جديد خارجها، فلا نهاية لهذه الأعداد.", "src": "https://en.wikipedia.org/wiki/Euclid%27s_theorem", "srct": "Euclid&#x27;s theorem"}, {"id": "w7", "cat": "رياضيات", "kind": "تاريخ", "t": "من اخترع حساب التفاضل والتكامل؟", "lead": "حين تنازع نيوتن وليبنتز على أحقية الاختراع، انقسم علماء الرياضيات في إنجلترا وأوروبا القارية أكثر من قرن.", "steps": ["لم يولد حساب التفاضل والتكامل (calculus) فجأة. ففي العصور القديمة استعمل إيدوكسوس (Eudoxus) طريقة الاستنفاد (method of exhaustion) لحساب المساحات والحجوم، ووسّعها أرخميدس (Archimedes). وفي الصين استعمل ليو هوي (Liu Hui) الطريقة نفسها لإيجاد مساحة الدائرة.", "وفي العصور الوسطى وسّع ابن الهيثم طريقة أرخميدس لإيجاد حجم جسم دوراني ناتج عن قطع مكافئ. وفي الهند ذكر بهاسكارا الثاني (Bhāskara II) أن جيب التمام هو مشتقة الجيب، وقالت مدرسة كيرالا بقيادة مادهافا (Madhava) بمتسلسلات لا نهائية قبل ظهورها في أوروبا بأكثر من 200 سنة.", "في إنجلترا صاغ نيوتن (Newton) حسابه بين 1664 و1666، واستعمل الفلوكسيونات (fluxions)، ولم يُنشر كتابه عنها إلا سنة 1736. وفي ألمانيا وضع ليبنتز (Leibniz) سنة 1675 الرموز dx وdy ورمز التكامل ∫، ونشر أولًا وأطلق اسم calculus.", "بعد 1711 اتهم الرجلان بعضهما بالسرقة العلمية، ومات ليبنتز سنة 1716. وفي القرن التاسع عشر يُنسب إلى فايرشتراس (Weierstrass) وضع الحساب على أساس صارم، وبيّن أبراهام روبنسون (Abraham Robinson) في القرن العشرين أن الكميات متناهية الصغر (infinitesimals) يمكن تأسيسها بدقة."], "key": "الحساب التفاضلي والتكاملي ثمرة جهود حضارات كثيرة عبر العصور، وصاغه نيوتن وليبنتز في القرن السابع عشر كلٌّ على طريقته.", "src": "https://en.wikipedia.org/wiki/History_of_calculus", "srct": "History of calculus"}, {"id": "w8", "cat": "رياضيات", "kind": "تاريخ", "t": "لماذا سُمّيت الأعداد المركبة خيالية في البداية؟", "lead": "وصف كاردانو هذه الأعداد بأنها دقيقة بقدر ما هي عديمة الفائدة، ثم صارت لاحقًا أساسًا في الرياضيات.", "steps": ["ظهرت الجذور التربيعية للأعداد السالبة أول مرة في إشارة عابرة عند هيرون الإسكندري (Hero of Alexandria) في القرن الأول الميلادي، وتقول الصفحة إنه فعل ذلك على الأرجح عن خطأ.", "في القرن السادس عشر وجد دل فيرو (del Ferro) وكاردانو (Cardano) خوارزمية لحل المعادلات من الدرجة الثالثة (cubic equations)، وكانت تعطي أحيانًا حلولًا تتضمن أعدادًا خيالية، فاعتبرها كاردانو غير مفيدة. وجاء بومبيلي (Bombelli) فوضع قواعد جمعها وطرحها وضربها واستخراج جذورها.", "سمّى ديكارت (Descartes) سنة 1637 هذه الكميات خيالية (imaginary) مؤكدًا أنها غير حقيقية. ثم اشتق أويلر (Euler) سنة 1748 صيغته التي تربط الأسّ المركب بالدوال المثلثية، وأسهم في اعتماد الرمز i.", "في 1799 وصف فيسل (Wessel) العدد المركب (complex number) بأنه نقطة في المستوي، وفعل أرغان (Argand) الأمر نفسه باستقلال سنة 1806. وفي 1831 ثبّت غاوس (Gauss) المصطلحات الحديثة ومنها اسم العدد المركب، وفي 1844 قدّم هاملتون (Hamilton) صياغة أكثر تجريدًا ووسّعها إلى الرباعيات (quaternions)."], "key": "بدأت الأعداد المركبة كحلول غريبة لمعادلات الدرجة الثالثة، ثم أصبحت نقاطًا في مستوٍ بفضل فيسل وأرغان وغاوس.", "src": "https://en.wikipedia.org/wiki/Complex_number", "srct": "Complex number"}, {"id": "w9", "cat": "رياضيات", "kind": "تاريخ", "t": "كيف حسب القدماء قيمة العدد π؟", "lead": "استمر أسلوب أرخميدس بالمضلعات المنتظمة مسيطرًا على حساب π أكثر من ألف سنة.", "steps": ["استعمل البابليون ما يقابل 25/8 أي 3.125 للعدد π (pi)، وأعطت بردية رايند (Rhind Papyrus) المصرية قاعدة لمساحة الدائرة تتضمن قيمة له.", "حوالي 250 ق.م. استعمل أرخميدس (Archimedes) مضلعات حتى 96 ضلعًا، وأثبت أن π أكبر من 223/71 وأصغر من 22/7. واستعمل ليو هوي (Liu Hui) نحو سنة 265 مضلعًا من 3072 ضلعًا فحصل على 3.1416، وبلغ زو تشونغتشي (Zu Chongzhi) حوالي 480 م. سبع خانات عشرية صحيحة بمضلع من 12288 ضلعًا.", "في 1424 حسب الكاشي (al-Kāshī) تسع خانات ستينية، أي نحو 16 خانة عشرية. ثم جاءت المتسلسلات اللانهائية (infinite series): استعملها مادهافا (Madhava) نحو 1400 لبلوغ 11 رقمًا، وبلغ نيوتن 15 رقمًا في 1665 أو 1666.", "أما الرمز π فاستعمله وليام جونز (William Jones) سنة 1706، ونشره أويلر (Euler) ابتداءً من 1736. وأثبت لامبرت (Lambert) سنة 1768 أن π عدد غير نسبي (irrational)، وأثبت ليندمان (Lindemann) سنة 1882 أنه متسامٍ (transcendental)، مما يعني استحالة تربيع الدائرة بالمسطرة والفرجار."], "key": "انتقل حساب π من المضلعات عند أرخميدس إلى المتسلسلات اللانهائية، ثم أُثبت أنه عدد غير نسبي ومتسامٍ.", "src": "https://en.wikipedia.org/wiki/Pi", "srct": "Pi"}, {"id": "w10", "cat": "رياضيات", "kind": "أساسية", "t": "كيف يمكن تمثيل أي دالة دورية بموجات الجيب وجيب التمام؟", "lead": "ابتكر فورييه هذه الفكرة ليحل مسألة انتشار الحرارة.", "steps": ["الفكرة الأساسية في متسلسلة فورييه (Fourier series) أن الدالة الدورية (periodic function) تُكتب كمجموع حدود من الجيب وجيب التمام تسمى التوافقيات (harmonics). وبما أن الدوال المثلثية مفهومة جيدًا، تصبح المسائل المتعلقة بالدالة الأصلية أسهل في الدراسة.", "المعاملات هي تكاملات للدالة مضروبة في دوال مثلثية. فإذا كانت الدورة P فإن الحد الثابت a₀ هو القيمة المتوسطة (1/P)∫s(x)dx، ويُحسب aₙ بالمقدار (2/P)∫s(x)cos(2πnx/P)dx، ويُحسب bₙ بالمقدار (2/P)∫s(x)sin(2πnx/P)dx.", "نشر جوزيف فورييه (Joseph Fourier) نتائجه الأولى سنة 1807 في بحث عن انتشار الحرارة في الأجسام الصلبة، ثم كتابه عن النظرية التحليلية للحرارة سنة 1822، وعبّر عن مصدر حراري معقد على شكل تراكب لموجات جيبية وجيب تمامية.", "كانت براهينه الأصلية غير دقيقة نوعًا ما لغياب تعريف دقيق للدالة والتكامل آنذاك، وقد صاغ ديريشليه (Dirichlet) وريمان (Riemann) نتائجه بدقة أكبر. وقد لا تتقارب المتسلسلة لأي دالة كيفية، لكن الدوال الجيدة السلوك، مثل الملساء، تتقارب إلى الدالة الأصلية."], "key": "متسلسلة فورييه تحلل الدالة الدورية إلى موجات جيبية وجيب تمامية بسيطة، وقد نشأت من دراسة الحرارة.", "src": "https://en.wikipedia.org/wiki/Fourier_series", "srct": "Fourier series"}, {"id": "w11", "cat": "رياضيات", "kind": "تاريخ", "t": "من أين جاءت الدوال المثلثية؟", "lead": "كلمتا جيب وجيب التمام العربيتان في اللغات الأجنبية جاءتا من مصطلحين هنديين مرّا بالترجمة.", "steps": ["استعمل المصريون القدماء شكلًا بسيطًا من علم المثلثات (trigonometry) في بناء الأهرام، وتحسب بردية رايند النسبة المسماة seked. وأعدّ هيبارخوس (Hipparchus) نحو 180 إلى 125 ق.م. أول جدول مثلثي معروف هو جدول الأوتار، ويُنسب إليه تقسيم الدائرة إلى 360 درجة إلى حد كبير. ثم وسّع بطليموس (Ptolemy) عمله في المجسطي (Almagest).", "في الهند عرّفت السدهانتا (Siddhantas) الجيب (sine) بدلالة نصف الوتر ونصف الزاوية، واكتشف آريابهاتا (Aryabhata) الجيب وجيب التمام وله جداول للجيب بفواصل 3.75 درجة. وصارت الكلمتان jya وkojya بعد الترجمة sine وcosine. وطوّر مادهافا (Madhava) نحو 1400 متسلسلات للجيب وجيب التمام وظل الزاوية العكسي.", "في العالم الإسلامي أنتج الخوارزمي جداول دقيقة للجيب وجيب التمام، وقدّم حبش الحاسب سنة 830 م. الظل وظل التمام، وقدّم البتاني (853 إلى 929) القاطع وقاطع التمام. واستعمل أبو الوفاء البوزجاني الدوال الست كلها واكتشف قانون الجيوب الكروي.", "كان نصير الدين الطوسي (1201 إلى 1274) أول من عالج علم المثلثات علمًا مستقلًا في كتابه عن الشكل الرباعي نحو 1260. وفي أوروبا عالجه ريجيومونتانوس (Regiomontanus) علمًا مستقلًا سنة 1464، وظهر مصطلح trigonometry أول مرة في كتاب بيتيسكوس (Pitiscus) سنة 1595، وأرسى أويلر (Euler) سنة 1748 المعالجة التحليلية للدوال المثلثية في أوروبا."], "key": "نشأ علم المثلثات من تطبيقات الفلك والبناء عند المصريين والبابليين، وطوّره اليونان والهنود والعلماء المسلمون ثم الأوروبيون.", "src": "https://en.wikipedia.org/wiki/History_of_trigonometry", "srct": "History of trigonometry"}, {"id": "w12", "cat": "كيمياء", "kind": "تاريخ", "t": "كيف توقّع مندلييف عناصر لم تكن قد اكتُشفت بعد؟", "lead": "ترك مندلييف خانات فارغة في جدوله، ثم اكتُشفت العناصر الناقصة لتملأها.", "steps": ["في عام 1869 رتّب العالم مندلييف (Mendeleev) 63 عنصرًا معروفًا في أعمدة حسب ازدياد الوزن الذري (atomic weight)، ولاحظ أن الخواص الكيميائية تتكرر بشكل دوري.", "في عام 1871 طوّر جدوله وصاغ قانون الدورية (law of periodicity). وترك خانات فارغة لعناصر لم تُكتشف بعد، وتوقّع ثمانية عشر عنصرًا في المجموع، لكن نحو نصفها فقط اكتُشف لاحقًا.", "من أشهر توقعاته عنصر سمّاه إيكا-ألومنيوم (eka-aluminium) بوزن ذري 68، وهو الغاليوم (gallium) الذي اكتُشف عام 1875. وسمّى آخر إيكا-سيليكون (eka-silicon) بوزن 72، وهو الجرمانيوم (germanium) الذي اكتُشف عام 1886. أما إيكا-بورون (eka-boron) بوزن 44 فهو السكانديوم (scandium) المكتشف عام 1879.", "وفي عام 1913 اقترح أنطونيوس فان دن بروك (van den Broek) أن العدد الذري (atomic number) هو الذي يحدد مكان العنصر في الجدول وليس الوزن الذري. ثم أثبت هنري موزلي (Moseley) ذلك بدراسة الأشعة السينية، فوضع الأرغون قبل البوتاسيوم والكوبالت قبل النيكل."], "key": "رتّب مندلييف العناصر حسب الوزن الذري وترك فراغات توقّع بها عناصر جديدة، ثم تبيّن لاحقًا أن العدد الذري هو أساس الترتيب.", "src": "https://en.wikipedia.org/wiki/History_of_the_periodic_table", "srct": "History of the periodic table"}, {"id": "w13", "cat": "كيمياء", "kind": "تجربة", "t": "كيف نصنع الأمونيا من هواء الجو والهيدروجين؟", "lead": "طريقة هابر لصنع الأمونيا ساعدت في إنتاج الأسمدة التي تغذي جزءًا كبيرًا من سكان العالم.", "steps": ["تُصنع الأمونيا (ammonia, NH₃) في عملية هابر (Haber process) من النيتروجين والهيدروجين وفق التفاعل العكسي: N₂ + 3H₂ ⇌ 2NH₃، وتُستعمل فيه حفازة (catalyst) من الحديد. ويُستعمل معظم الأمونيا المنتجة في الأسمدة النيتروجينية.", "التفاعل طارد للحرارة (exothermic)، لذلك يقلّ مردود الاتزان كلما ارتفعت الحرارة. ومع ذلك تُجرى العملية في نحو 300 إلى 500 درجة مئوية، لأن الحفازة تعمل جيدًا في حدود 400 إلى 500 درجة. أما الضغط العالي فيُفضّل الأمونيا، لأن أربعة مولات من المتفاعلات تعطي مولين من الناتج.", "في كل مرور للغاز يتحول نحو 15 بالمئة فقط، فتُكثَّف الأمونيا وتُعاد الغازات غير المتفاعلة إلى الدورة. وبذلك يبلغ التحويل الإجمالي نحو 97 إلى 98 بالمئة.", "من الناحية التاريخية نشر فريتز هابر (Fritz Haber) أعماله الحرارية عام 1905، وأجرى مع روبرت لو روسينيول عرضًا مخبريًا عام 1909. ثم طوّر كارل بوش (Carl Bosch) العملية صناعيًا لشركة BASF عام 1910، وافتُتح أول مصنع في أوباو بألمانيا عام 1913. وبلغ الإنتاج نحو 230 مليون طن من الأمونيا عام 2018."], "key": "عملية هابر تحوّل النيتروجين والهيدروجين إلى أمونيا بحفازة من الحديد وبضغط عالٍ وحرارة معتدلة، وأغلب الناتج يذهب إلى الأسمدة.", "src": "https://en.wikipedia.org/wiki/Haber_process", "srct": "Haber process"}, {"id": "w14", "cat": "كيمياء", "kind": "أساسية", "t": "ماذا يحدث للتفاعل المتزن عندما نغيّر ظروفه؟", "lead": "إذا اضطربت جملة في حالة اتزان، فإنها تتحرك لتخفف من أثر هذا الاضطراب جزئيًا.", "steps": ["ينص مبدأ لوشاتولييه (Le Chatelier&#x27;s principle) على أن الجملة المتزنة (equilibrium) تنتقل إلى اتزان جديد عند تغيير التركيز أو الحرارة أو الحجم أو الضغط، وأن هذا الانتقال يعاكس التغيير المطبَّق جزئيًا. وسُمّي المبدأ باسم الكيميائي الفرنسي هنري لوي لوشاتولييه، وينسبه البعض أيضًا إلى كارل فرديناند براون (Braun).", "بالنسبة للتركيز: إذا أضفنا مادة مشاركة في التفاعل ينزاح الاتزان بعيدًا عنها. ففي التفاعل CO + 2H₂ ⇌ CH₃OH تؤدي إضافة CO إلى زيادة الميثانول. وإزالة أحد النواتج تدفع التفاعل إلى الأمام.", "بالنسبة للحرارة: في التفاعلات الطاردة للحرارة يؤدي رفع الحرارة إلى نقصان ثابت الاتزان K، وفي الماصة للحرارة يؤدي إلى زيادته. وبالنسبة للحجم: تقليله يفضّل الجهة التي فيها عدد أقل من مولات الغاز. أما الحفاز (catalyst) فيسرّع التفاعلين الأمامي والعكسي بالقدر نفسه، فلا يغيّر موضع الاتزان.", "مثال ذلك تفاعل هابر N₂ + 3H₂ ⇌ 2NH₃ وقيمة ΔH فيه تساوي -92 كيلوجول لكل مول. تخفيض الحرارة يعطي أمونيا أكثر عند الاتزان لكنه يبطئ التفاعل، لذلك تُختار حرارة وسطية توازن بين السرعة والمردود. ويُذكر أيضًا أن المبدأ لا ينطبق إلا على الجمل المتزنة ترموديناميكيًا."], "key": "عند تغيير شروط جملة متزنة ينزاح الاتزان في الاتجاه الذي يخفف أثر التغيير، والحفاز يغيّر السرعة فقط ولا يغيّر موضع الاتزان.", "src": "https://en.wikipedia.org/wiki/Le_Chatelier's_principle", "srct": "Le Chatelier&#x27;s principle"}, {"id": "w15", "cat": "كيمياء", "kind": "بنية", "t": "كم جسيمًا يوجد في مول واحد من المادة؟", "lead": "ثابت أفوغادرو رقم مضبوط تمامًا منذ 20 ماي 2019.", "steps": ["ثابت أفوغادرو (Avogadro constant) رمزه N_A، وهو يحوّل كمية المادة بالمول (mole) إلى عدد الجسيمات، سواء كانت ذرات أو جزيئات أو أيونات. وقيمته 6.02214076×10²³ لكل مول، وهي قيمة دقيقة تمامًا منذ 20 ماي 2019.", "من الناحية التاريخية اقترح أميديو أفوغادرو (Avogadro) عام 1811 أن الحجوم المتساوية من الغازات في الشروط نفسها تحتوي أعدادًا متساوية من الجزيئات. وفي عام 1860 روّج ستانيسلاو كانيتزارو (Cannizzaro) لأعماله في مؤتمر كارلسروه.", "وفي عام 1909 أطلق جان بيران (Perrin) اسم عدد أفوغادرو على هذا العدد. وفي عام 1971 جعل المول وحدة أساسية في النظام الدولي (SI) وعُرّف بعدد الذرات في 12 غرامًا من الكربون 12.", "ومنذ 20 ماي 2019 صار المول معرّفًا بأنه يحوي بالضبط 6.02214076×10²³ جسيمًا. ويرتبط الثابت بغيره، فثابت الغازات R يساوي حاصل ضرب ثابت بولتزمان k_B في N_A."], "key": "المول الواحد يحتوي بالضبط 6.02214076×10²³ جسيمًا، وهذا هو ثابت أفوغادرو.", "src": "https://en.wikipedia.org/wiki/Avogadro_constant", "srct": "Avogadro constant"}, {"id": "w16", "cat": "كيمياء", "kind": "أساسية", "t": "ما الفرق بين تعريف أرهينيوس وتعريف برونستد–لوري للحمض والقاعدة؟", "lead": "تعريف برونستد–لوري يصلح لأي مذيب، بينما يقتصر تعريف أرهينيوس على الماء.", "steps": ["حسب أرهينيوس (Arrhenius) الحمض (acid) مادة تتأين في الماء وتعطي أيونات الهيدروجين H⁺، والقاعدة (base) مادة تتفكك في الماء وتعطي أيونات الهيدروكسيد OH⁻. ويُذكر أن H⁺ رمز مختصر لأيون الهيدرونيوم H₃O⁺. وقد نال أرهينيوس جائزة نوبل في الكيمياء عام 1903.", "عند تفاعل حمض مع قاعدة ينتج ملح وماء، مثل تفاعل HCl مع NaOH الذي يعطي NaCl والماء. لكن هذا التعريف يخص المحاليل المائية فقط، فمثلًا HCl وH₂SO₄ النقيان المذابان في التولوين ليسا حمضيين.", "في عام 1923 صاغ يوهانس برونستد (Brønsted) من الدنمارك ومارتن لوري (Lowry) من إنجلترا تعريفًا مستقلًا: الحمض يعطي بروتونًا H⁺ والقاعدة تستقبله. وما يتبقى من الحمض بعد فقد البروتون هو القاعدة المرافقة (conjugate base)، وما ينتج من القاعدة بعد استقبال البروتون هو الحمض المرافق (conjugate acid).", "مثال ذلك أن HCl في الماء يعطي بروتونًا فيتحول إلى Cl⁻، بينما يستقبله الماء فيصبح H₃O⁺. والماء مذبذب (amphoteric) أي يتصرف كحمض وكقاعدة. وهذا التعريف مستقل عن المذيب، لكنه يتطلب وجود الهيدروجين، فلا يعدّ SO₃ وBCl₃ حمضين."], "key": "أرهينيوس يعتمد على H⁺ وOH⁻ في الماء، أما برونستد–لوري فيعتمد على انتقال البروتون وهو أعم.", "src": "https://en.wikipedia.org/wiki/Acid%E2%80%93base_reaction", "srct": "Acid–base reaction"}, {"id": "w17", "cat": "كيمياء", "kind": "بنية", "t": "لماذا تعمل الطائرات النفاثة بالكيروسين وليس بالبنزين؟", "lead": "محركات التوربين تحرق وقودًا أقل قابلية للاشتعال وأكثر أمانًا في النقل.", "steps": ["وقود الطائرات من نوع الكيروسين (kerosene) خليط من الهيدروكربونات (hydrocarbons) تحتوي جزيئاتها عادة على نحو 8 إلى 16 ذرة كربون. ومنه الوقودان Jet A وJet A-1.", "محركات التوربين تحقن الوقود في حجرة احتراق ساخنة، فيمكنها استعمال وقود أرخص ونقطة وميضه (flash point) أعلى، وهو أقل قابلية للاشتعال وأكثر أمانًا في النقل والمناولة. ونقطة الوميض لكل من Jet A وJet A-1 لا تقل عن 38 درجة مئوية. أما البنزين فكان غير جذاب للمحركات النفاثة الأولى بسبب استهلاكه العالي.", "الفرق الرئيسي بين النوعين في نقطة التجمد (freezing point): هي -40 درجة مئوية لـ Jet A و-47 درجة مئوية لـ Jet A-1.", "أما الطاقة (energy content) فالطاقة النوعية لـ Jet A-1 تساوي 43.15 ميغاجول لكل كيلوغرام، وكثافة طاقته 34.7 ميغاجول لكل لتر. وتبلغ قيمتاهما لـ Jet A نحو 43.02 ميغاجول/كغ و35.3 ميغاجول/لتر."], "key": "يُستعمل الكيروسين في الطائرات لأن نقطة وميضه عالية وأمان نقله أفضل، ونقطة تجمده منخفضة، ويحمل طاقة كبيرة.", "src": "https://en.wikipedia.org/wiki/Jet_fuel", "srct": "Jet fuel"}, {"id": "w18", "cat": "بيولوجيا", "kind": "بنية", "t": "مم يتكوّن جدار الخلية النباتية ولماذا تبدو الخلايا النباتية صلبة؟", "lead": "الجدار نفسه مرن، فمن أين تأتي صلابة النبات إذن؟", "steps": ["جدار الخلية (cell wall) طبقة بنيوية خارج الغشاء الخلوي، تعطي الخلية الدعم والشكل والحماية وتعمل حاجزًا انتقائيًا. وهو يساعد الخلية على تحمل الضغط الأسموزي والإجهاد الميكانيكي ويمنع انفجارها. توجد الجدر في النباتات والطحالب والفطريات، ولا توجد في الخلايا الحيوانية.", "قد يتكوّن الجدار من ثلاث طبقات. الجدار الأولي (primary cell wall) رقيق ومرن، ويتكوّن من ألياف السليلوز (cellulose) المرتبطة بروابط هيدروجينية، والهيميسليلوز (hemicellulose) الذي يربط الألياف في شبكة، والبكتين (pectin) الذي تنغمس فيه هذه الشبكة، إضافة إلى نسبة صغيرة من البروتينات.", "الجدار الثانوي (secondary cell wall) سميك يتكوّن داخل الجدار الأولي بعد اكتمال نمو الخلية، ولا يوجد في كل أنواع الخلايا. يملأ اللجنين (lignin) الفراغات بين مكوناته فيقوّيه ويجعله مانعًا للماء. أما الصفيحة الوسطى (middle lamella) فهي الطبقة الخارجية الغنية بالبكتين، وتلصق الخلايا المتجاورة ببعضها.", "مصدر الصلابة هو ضغط الامتلاء (turgor pressure): يدخل الماء إلى الخلية بالخاصية الأسموزية فتنتفخ الخلية وتضغط على الجدار. والجدار نفسه مرن لكنه قوي أمام الشد، ويدل على مرونته ذبول الأوراق والسيقان. وشبّه المصدر ذلك بسلة من القش بداخلها بالون منفوخ."], "key": "يحمي الجدار الخلية ويقاوم الشد، لكن صلابة الأنسجة النباتية تأتي أساسًا من ضغط الامتلاء الذي يدفع الماء الداخل ضد الجدار.", "src": "https://en.wikipedia.org/wiki/Cell_wall", "srct": "Cell wall"}, {"id": "w19", "cat": "بيولوجيا", "kind": "أساسية", "t": "ماذا يحدث في القلب خلال نبضة واحدة؟", "lead": "في نحو 0.8 ثانية فقط يمرّ القلب بسلسلة كاملة من الانقباض والانبساط.", "steps": ["الدورة القلبية (cardiac cycle) هي سلسلة نشاط القلب من بداية نبضة إلى بداية النبضة التي تليها. لها مرحلتان رئيسيتان: الانبساط (diastole) حيث يسترخي القلب ويمتلئ، والانقباض (systole) حيث ينقبض ويدفع الدم.", "في انبساط البطينين يسترخي البطينان ويتمددان، ويتدفق الدم من الأذينين إلى البطينين، والصمامان الأذينيان البطينيان (AV valves) مفتوحان. في نهاية الانبساط ينقبض الأذينان (atrial systole) ويدفعان كمية أخيرة من الدم إلى البطينين.", "في انقباض البطينين (ventricular systole) يرتفع الضغط وتُغلق الصمامات الأذينية البطينية، ويبقى الحجم ثابتًا لحظيًا. وحين يتجاوز ضغط البطين ضغط الأبهر والشريان الرئوي تنفتح الصمامات الهلالية (semilunar valves) ويُقذف الدم.", "عندما ينخفض ضغط البطين دون ضغط الشرايين تُغلق الصمامات الهلالية وتتكرر الدورة. تقود العقدة الجيبية الأذينية (SA node) الإيقاع وتبدأ انقباض الأذينين، وتؤخر العقدة الأذينية البطينية (AV node) الإشارة ليمتلئ البطينان قبل انقباضهما.", "في القلب السليم أثناء الراحة يكون المعدل نحو 70 إلى 75 نبضة في الدقيقة، وتستغرق الدورة الواحدة نحو 0.8 ثانية. وتتناسب مدة الدورة عكسيًا مع معدل القلب."], "key": "الدورة القلبية تناوب بين انبساط يمتلئ فيه القلب وانقباض يدفع الدم، وتتحكم فيه صمامات وإشارات كهربائية، وتدوم نحو 0.8 ثانية.", "src": "https://en.wikipedia.org/wiki/Cardiac_cycle", "srct": "Cardiac cycle"}, {"id": "w20", "cat": "بيولوجيا", "kind": "تجربة", "t": "كيف أثبتت تجربة ميسلسون وستال أن الـ DNA ينسخ نفسه بطريقة نصف محافظة؟", "lead": "استُخدم نظيران مختلفان للنيتروجين لتمييز DNA القديم من الجديد، فسُميت أجمل تجربة في علم الأحياء.", "steps": ["السؤال هو كيف يتضاعف الـ DNA، وكانت هناك ثلاثة نماذج. في النموذج نصف المحافظ (semiconservative) الذي اقترحه واتسون وكريك سنة 1953 ينفصل الشريطان ويكون كل منهما قالبًا لشريط جديد. في النموذج المحافظ (conservative) يكون أحد الجزيئين الناتجين قديمًا كليًا والآخر جديدًا كليًا. وفي النموذج المشتت (dispersive) الذي اقترحه ماكس ديلبروك (Max Delbrück) سنة 1954 تتقطع الحلزونة وتختلط القطع القديمة والجديدة.", "أجرى ماثيو ميسلسون وفرانكلين ستال (Matthew Meselson and Franklin Stahl) التجربة سنة 1958. النيتروجين موجود في قواعد الـ DNA كلها، فاستخدما النظير الأثقل غير المشع 15N بدل 14N المعتاد. نميت بكتيريا الإشريكية القولونية (E. coli) عدة أجيال في وسط يحتوي 15NH4Cl فصار الـ DNA فيها موسومًا بـ 15N، ثم نقلت إلى وسط 14N لتنقسم.", "استُخلص الـ DNA على فترات وفُصل بالطرد المركزي حسب الكثافة في تدرج كلوريد السيزيوم (CsCl). يستقر كل شريط عند الموضع الذي تتساوى فيه كثافته مع كثافة المحلول، وكان DNA الموسوم بـ 15N أكثف من DNA الموسوم بـ 14N.", "النتائج: في الجيل صفر ظهر الـ DNA عند الكثافة العالية. بعد تضاعف واحد صار كل الـ DNA بكثافة متوسطة، وهذا استبعد النموذج المحافظ. بعد تضاعفين ظهر شريطان متساويان، أحدهما بكثافة متوسطة والآخر بكثافة 14N، وهذا استبعد النموذج المشتت.", "الخلاصة أن الـ DNA يتضاعف بطريقة نصف محافظة، فيحتوي كل جزيء ابن على شريط أبوي وشريط جديد."], "key": "أثبت ميسلسون وستال سنة 1958 بنظائر النيتروجين والطرد المركزي أن كل جزيء DNA جديد يحمل شريطًا قديمًا وشريطًا جديدًا.", "src": "https://en.wikipedia.org/wiki/Meselson%E2%80%93Stahl_experiment", "srct": "Meselson–Stahl experiment"}, {"id": "w21", "cat": "بيولوجيا", "kind": "أساسية", "t": "كيف تنتقل الإشارة العصبية على طول الخلية العصبية؟", "lead": "ارتفاع وانخفاض سريع في الجهد الكهربائي عبر الغشاء يدوم نحو جزء من ألف من الثانية.", "steps": ["جهد الفعل (action potential) ارتفاع وانخفاض سريعان في الجهد عبر غشاء الخلية. يسمى في العصبونات السيال العصبي (nerve impulse) أو الشوكة (spike)، ويحدث في الخلايا المثارة كالعصبونات والخلايا العضلية.", "في الراحة يكون جهد الغشاء (resting potential) نحو -70 ملي فولت، والداخل سالب بالنسبة للخارج. وعند التلة المحورية (axon hillock) يبلغ العتبة (threshold) نحو -55 ملي فولت، وعندها يبدأ تغذية راجعة موجبة بفعل الصوديوم.", "في مرحلة زوال الاستقطاب (depolarization) تنفتح قنوات الصوديوم المعتمدة على الجهد فيدخل Na+ ويصبح الداخل أكثر إيجابية، ويقترب الجهد من نحو +55 ملي فولت. ثم تنعطل قنوات الصوديوم.", "في مرحلة إعادة الاستقطاب (repolarization) تنغلق قنوات الصوديوم وتنفتح قنوات البوتاسيوم، فيخرج K+ ويعود الغشاء نحو جهد الراحة. وقد ينخفض الجهد لحظيًا دون الراحة نحو -75 ملي فولت، وهي مرحلة فرط الاستقطاب (hyperpolarization).", "يخضع جهد الفعل لمبدأ الكل أو لا شيء (all-or-none): إما أن يحدث كاملًا أو لا يحدث، ولا يعتمد حجمه على قوة المنبه، وتُشفّر شدة المنبه بتردد الإطلاق. وفي فترة الجموح المطلقة (absolute refractory period) لا يمكن إطلاق جهد جديد لأن قنوات الصوديوم معطلة، وهذا يحافظ على اتجاه واحد للانتشار.", "تدوم معظم جهود الفعل العصبية نحو 1 ملي ثانية."], "key": "جهد الفعل دخول سريع للصوديوم يتبعه خروج للبوتاسيوم، ويحدث كاملًا أو لا يحدث عند بلوغ العتبة.", "src": "https://en.wikipedia.org/wiki/Action_potential", "srct": "Action potential"}, {"id": "w22", "cat": "بيولوجيا", "kind": "تجربة", "t": "كيف أثبتت تجربة هيرشي وتشيس أن الـ DNA هو المادة الوراثية؟", "lead": "استُخدم الفوسفور المشع للـ DNA والكبريت المشع للبروتين لمعرفة أيهما يدخل البكتيريا.", "steps": ["اعتقد كثير من العلماء أن البروتينات تحمل المعلومات الوراثية لأنها تبدو أكثر تعقيدًا من الـ DNA. ورغم أن تجربة أفيري وماكلويد وماكارتي سنة 1944 أشارت إلى الـ DNA، بقي المجتمع العلمي متحفظًا. والسؤال: هل المادة الوراثية هي الـ DNA أم البروتين؟", "أجرى ألفريد هيرشي ومارثا تشيس (Alfred Hershey and Martha Chase) التجربة ونشراها سنة 1952 على العاثية T2 (bacteriophage T2)، وهي فيروس يتكون من DNA وغلاف بروتيني ويصيب البكتيريا.", "الفوسفور موجود في الـ DNA وليس في البروتين، فوُسم الـ DNA بالفوسفور المشع 32P. والكبريت موجود في البروتين وليس في الـ DNA، فوُسم البروتين بالكبريت المشع 35S. بعد إصابة بكتيريا غير موسومة، حُرّك الخليط في خلاط لنزع الأغلفة عن البكتيريا، ثم فُصلت بالطرد المركزي.", "النتيجة: بقي نحو 20% فقط من 32P خارج البكتيريا، أي أن DNA العاثية دخل الخلايا، بينما بقي الكبريت 35S كله تقريبًا خارجها. وأعطت العاثيات الموسومة بـ 32P ذرية مشعة، أما الموسومة بـ 35S فلا.", "الخلاصة أن الـ DNA، لا البروتين، هو المادة الوراثية، فقد دخل الخلية البكتيرية وأمر بإنتاج عاثيات جديدة بينما بقي الغلاف البروتيني خارجها. ولم تحدد التجربة وظيفة الـ DNA الوراثية بدقة. وفي سنة 1953 اقترح واتسون وكريك البنية الحلزونية المزدوجة للـ DNA."], "key": "بيّنت تجربة هيرشي وتشيس سنة 1952 أن الذي يدخل البكتيريا هو الـ DNA، فهو المادة الوراثية.", "src": "https://en.wikipedia.org/wiki/Hershey%E2%80%93Chase_experiment", "srct": "Hershey–Chase experiment"}, {"id": "w23", "cat": "فيزياء", "kind": "تجربة", "t": "كيف «وُزنت» الأرض في مخبر صغير؟", "lead": "قاس كافنديش قوة جذب بين كرات رصاص تبلغ نحو جزء من عشرة ملايين من النيوتن، ومن ذلك استنتج كثافة الأرض.", "steps": ["أجرى هنري كافنديش (Henry Cavendish) التجربة بين 1797 و1798 ونشرها سنة 1798 في مجلة الجمعية الملكية. أما فكرة الجهاز فتعود إلى الجيولوجي جون ميشيل (John Michell) الذي صمم ميزان اللي (torsion balance) قبل 1783 ومات سنة 1793 قبل أن يستعمله. ورث الجهاز فرانسيس ولاستون ثم كافنديش، فأعاد بناءه.", "يتكوّن الجهاز من قضيب خشبي طوله نحو 1.8 م معلّق أفقيًا بسلك، في طرفيه كرتان صغيرتان من الرصاص كتلة كل منهما نحو 0.73 كغ. وتوضع قرب الكرتين الصغيرتين كرتان كبيرتان من الرصاص كتلة كل منهما نحو 158 كغ. وُضع كل ذلك في صندوق من خشب الماهوغني داخل سقيفة مغلقة، وكان كافنديش يراقب القضيب بمنظارين عبر ثقبين في جدار السقيفة ليتجنب تيارات الهواء.", "تجذب الكرتان الكبيرتان الكرتين الصغيرتين فيدور القضيب قليلًا ويلتوي السلك. كان الانحراف نحو 0.16 إنش فقط، أي بضعة ملّيمترات، وقدّرت القوة بنحو 1.74×10⁻⁷ نيوتن. وعند التوازن تتساوى عزوم قوة الجذب مع عزم اللي في السلك، وهو يتناسب مع زاوية الانحراف، وحصل كافنديش على ثابت اللي من زمن اهتزاز القضيب.", "ثم ربط هذه القوة بقانون الجذب العام لنيوتن، ومعها تسارع الجاذبية على سطح الأرض، فحسب كثافة الأرض. كانت النتيجة 5.448 مرة كثافة الماء بهامش ±0.033، والقيمة المقبولة اليوم 5.514 غ/سم³. ولم يعبّر كافنديش عن نتيجته بثابت الجذب G، لكن إذا حُوّلت نتيجته إلى الوحدات الدولية فإن G ≈ 6.74×10⁻¹¹، وهي أبعد عن قيمة CODATA 2014 بنحو 1%. وسمّى عمله «وزن العالم» (weighing the world)."], "key": "من قوة صغيرة جدًا بين كرات رصاص، وبقانون نيوتن، أمكن حساب كثافة الأرض ثم كتلتها، دون أن يغادر الباحث غرفته.", "src": "https://en.wikipedia.org/wiki/Cavendish_experiment", "srct": "Cavendish experiment"}, {"id": "w24", "cat": "بيولوجيا", "kind": "بنية", "t": "كيف يتكوّن غشاء الخلية ولماذا يوصف بأنه سائل وفسيفسائي؟", "lead": "غشاء الخلية ليس جدارًا ثابتًا، فجزيئاته تتحرك وتنتشر مع الزمن.", "steps": ["وصف سينغر ونيكولسون (Singer and Nicolson) سنة 1972 النموذج الفسيفسائي السائل (fluid mosaic model). في هذا النموذج الغشاء طبقة ثنائية سمكها نحو جزيئين من دهون فوسفورية ثنائية الألفة (amphipathic phospholipids) تتخللها بروتينات، ويشبه «سائلًا ثنائي الأبعاد» تتوزع فيه البروتينات عادة عشوائيًا.", "تمنح الطبقة الدهنية الغشاء سيولته ومرونته، والكوليسترول (cholesterol) يوجد بين الدهون الفوسفورية ويساعد الغشاء على الاحتفاظ بسيولته. وتوجد كميات صغيرة من السكريات مرتبطة ببروتينات على السطح الخارجي، وتفيد في تعارف الخلايا.", "من الأدلة تجربة فراي وإيديدين (Frye and Edidin) سنة 1970: استعملا فيروس سينداي (Sendai virus) لدمج خلية بشرية وخلية فأر في خلية واحدة. أظهر التلوين بالأجسام المضادة أن بروتينات الفأر وبروتينات الإنسان تبقى في نصفين منفصلين بعد الدمج مباشرة، ثم تنتشر مع الوقت فيزول الحد بينهما. وعند خفض الحرارة يبطؤ هذا الانتشار لأن الدهون الفوسفورية تنتقل من الطور السائل إلى طور شبيه بالهلام (gel).", "وكان النموذج السابق هو نموذج دافسون ودانييلي (Davson and Danielli) سنة 1935: طبقة دهنية يحيط بها صفان من البروتين، فالبروتينات صفائح بجانب الدهون لا جزء من الطبقة الثنائية."], "key": "الغشاء طبقة دهنية ثنائية سائلة تتخللها بروتينات متحركة، والحرارة والكوليسترول يضبطان سيولته.", "src": "https://en.wikipedia.org/wiki/Fluid_mosaic_model", "srct": "Fluid mosaic model"}]);

const $=q=>document.querySelector(q);let stop=null,cur=null;
let seen={};try{seen=JSON.parse(localStorage.getItem('seen')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('seen',JSON.stringify(seen))}catch(e){}};
$('#tot').textContent=T.length;
function show(id,upd){const t=T.find(x=>x.id===id)||T[0];if(stop)stop();cur=t;
 const a=$('#card');a.innerHTML='';a.append(el('span','cat',t.cat+(t.kind?' · '+t.kind:'')),el('h1',null,t.t),el('p','lead',t.lead));
 stop=null;
 if(t.setup){stop=t.setup(a);
 t.info.forEach(p=>{a.append(el('h2',null,p[0]),el('p',null,p[1]))});
 a.append(el('h2',null,'فكّر قليلًا'),el('p',null,t.think));}
 else{a.append(el('h2',null,'الشرح'));t.steps.forEach(x=>a.append(el('p',null,x)))}
 const k=el('div','key');k.append(el('h2',null,'الفكرة التي تحتفظ بها'),el('p',null,t.key));a.append(k);
 if(t.src){const q=el('p','src','المصدر: ويكيبيديا الإنجليزية، صفحة ');const l=el('a',null,t.srct);l.href=t.src;l.target='_blank';l.rel='noopener';q.append(l,document.createTextNode('. الدرس مكتوب بالعربية بتصرف من الصفحة. افتحها إن أردت التفصيل.'));a.append(q)}
 const r=el('div','actions');const d=el('button','done');d.type='button';d.id='done';
 const sync=()=>{const on=!!seen[t.id];d.setAttribute('aria-pressed',on);d.textContent=on?'✓ فهمتها':'فهمتها'};sync();
 d.onclick=()=>{if(seen[t.id])delete seen[t.id];else seen[t.id]=1;save();sync();idx()};
 const n=el('button',null,'درس آخر ↻');n.type='button';n.onclick=rand;r.append(n,d);a.append(r);
 if(!upd&&location.hash!=='#'+t.id)history.replaceState(null,'','#'+t.id);window.scrollTo(0,0);idx()}
